manifestVersion: 1
id: bisq2-node
# umbrelOS 2.0 storage management: lets users relocate the app data (our compose only mounts
# ${APP_DATA_DIR}/data, which umbreld redirects to the chosen location). Ignored by older umbrelOS.
storage:
  dataRoot: data
category: finance
name: Bisq 2 Node
version: "2.1.14.1"
tagline: Self-hosted Bisq 2 node for the Bisq Connect mobile app
description: >-
  Run your own Bisq 2 node so the Bisq Connect mobile app can connect to a node you
  control instead of a stranger's — more privacy, no third-party trust.


  The node is headless and reaches the Bisq P2P network over its own bundled Tor.
  This app gives it a simple browser face: open it to see node status and a pairing
  QR code, scan it from Bisq Connect, and you're paired.


  Heads up: the pairing code grants trade control of your node. Umbrel's
  authenticated app proxy is what protects it — never expose this app to an
  untrusted network.
developer: Bisq
website: https://bisq.network
dependencies: []
repo: https://github.com/bisq-network/bisq2-umbrel
support: https://github.com/bisq-network/bisq-mobile/issues
port: 8091
# Community stores don't auto-discover a local icon.svg — the icon must be an absolute
# URL. We serve our committed bisq2-node/icon.svg via jsDelivr, which (unlike raw GitHub)
# returns it with an image/svg+xml content-type so umbrelOS renders it.
# Served from @main so it always reflects the committed icon.svg once merged. (jsDelivr caches
# @main up to ~7 days, so an icon change may take a bit to propagate — fine for a rarely-changed icon.)
icon: https://cdn.jsdelivr.net/gh/bisq-network/bisq2-umbrel@main/bisq2-node/icon.svg
# Like the icon, gallery entries must be absolute URLs here — umbrelOS did not resolve
# bare filenames for this community store. Served from the committed jpgs via jsDelivr.
gallery:
  - https://cdn.jsdelivr.net/gh/bisq-network/bisq2-umbrel@main/bisq2-node/1.jpg
  - https://cdn.jsdelivr.net/gh/bisq-network/bisq2-umbrel@main/bisq2-node/2.jpg
  - https://cdn.jsdelivr.net/gh/bisq-network/bisq2-umbrel@main/bisq2-node/3.jpg
  - https://cdn.jsdelivr.net/gh/bisq-network/bisq2-umbrel@main/bisq2-node/4.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: rodvar
submission: ""
releaseNotes: "Maintenance update on Bisq 2 API 2.1.14. The node can now check a seller's payment account data against the banned list, so the next Bisq Connect release can warn you not to pay a seller whose account data is banned and cancel the trade for your protection. The offerbook the node sends to Bisq Connect now follows the same rules as Bisq 2 desktop: offers from banned or ignored makers, and sell offers whose maker lacks the reputation for the amount, are no longer listed, and the offer counts match the list. If the node fails to start it now exits, so it is restarted automatically instead of running without the API, and a pairing code left over from an earlier run is deleted at startup. Cancelling or rejecting a trade no longer waits for the trade chat message to be delivered. Also includes storage pruning and performance fixes. No action needed: Bisq Connect stays paired. — Full changes: https://github.com/bisq-network/bisq2/compare/52f9141...7f68c09 (bisq2 @ 7f68c09)"